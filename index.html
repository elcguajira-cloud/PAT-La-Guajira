<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan de Acción Territorial La Guajira · POA 2026-2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--un:#009EDB;--un2:#0077B3;--un3:#0B4F7C;--sky:#DFF2FB;--navy:#13304D;--navy2:#1B3A57;--ink:#1F2933;--ink2:#52606D;--ink3:#8A96A3;
--line:#E4E8EE;--bg:#EEF2F6;--card:#fff;--ok:#2E8540;--warn:#E59400;--warnbg:#FDF0D5;--gray:#A7B1BC;--hum:#E86A33;--tra:#F2B100;--des:#2E8540}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Roboto,"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.5;display:flex;height:100vh;overflow:hidden}
button{font:inherit;cursor:pointer}
aside{width:272px;flex-shrink:0;background:var(--navy);color:#C9D6E3;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.logos{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:10px;margin-bottom:16px;background:#fff;border-radius:8px;padding:10px 10px}
.lg{display:flex;align-items:center;justify-content:center;min-width:0}.lg:first-child{flex:1.6}.lg:last-child{flex:1}
.lg img{max-height:38px;max-width:100%;object-fit:contain}
.lg em{display:none;font-style:normal;font-size:9.5px;color:#52606D;text-align:center;line-height:1.1}
.lg.miss{background:rgba(255,255,255,.08);border:1.5px dashed rgba(255,255,255,.4)}.lg.miss img{display:none}.lg.miss em{display:block;color:#C9D6E3}
.brand b{display:block;color:#fff;font-weight:500;font-size:16px;line-height:1.3;margin-bottom:2px}
.brand span{font-size:11.5px;color:#8FA6BD}
nav{padding:12px 10px;display:flex;flex-direction:column;gap:2px}
nav button{display:flex;align-items:center;gap:12px;background:none;border:0;color:#C9D6E3;padding:10px 12px;border-radius:6px;text-align:left;font-size:13.5px}
nav button svg{width:18px;height:18px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button:hover{background:rgba(255,255,255,.06);color:#fff}
nav button.on{background:var(--un);color:#fff}
.side-foot{margin-top:auto;padding:16px 20px;font-size:11px;color:#7F97AF;border-top:1px solid rgba(255,255,255,.08)}
.side-foot .tag{display:inline-block;background:rgba(0,158,219,.18);color:#7FD3F5;padding:2px 8px;border-radius:3px;font-size:10.5px;letter-spacing:.4px;margin-bottom:6px}
.wrap{flex:1;min-width:0;height:100vh;overflow-y:auto}
.topbar{background:var(--card);border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.topbar h1{font-size:19px;font-weight:500;margin:0;color:var(--navy)}
.topbar .sub{font-size:12px;color:var(--ink3)}
.search{margin-left:auto;position:relative}
.search input{font:inherit;width:260px;padding:8px 12px 8px 34px;border:1px solid #D3DAE2;border-radius:20px;background:#F7F9FB;outline:none}
.search input:focus{border-color:var(--un);background:#fff}
.search svg{position:absolute;left:11px;top:9px;width:16px;height:16px;stroke:var(--ink3);fill:none;stroke-width:2}
.chips{padding:10px 28px 0;display:flex;gap:8px;flex-wrap:wrap;min-height:0}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--un3);color:#fff;border:0;border-radius:16px;padding:4px 6px 4px 12px;font-size:12px}
.chip i{font-style:normal;background:rgba(255,255,255,.2);width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.chip.clear{background:none;color:var(--un2);padding:4px 8px;text-decoration:underline}
.view{padding:20px 28px 48px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:10px;border:1px solid var(--line);padding:18px 20px}
.card h2{font-size:12px;font-weight:500;color:var(--ink2);text-transform:uppercase;letter-spacing:.6px;margin:0 0 12px}
.g{display:grid;gap:16px}
.hero{grid-template-columns:minmax(0,1fr) minmax(0,1fr);margin-bottom:16px;align-items:start}
.donutbox{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.donut circle{transition:stroke-width .15s}
.donut circle[data-f]:hover{stroke-width:22;cursor:pointer}
.donut text{pointer-events:none}
.big{font-size:44px;font-weight:300;color:var(--navy);line-height:1}
.big small{font-size:16px;color:var(--ink3)}
.leg{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.leg button{display:flex;align-items:center;gap:8px;background:none;border:1px solid transparent;border-radius:6px;padding:4px 8px;margin-left:-8px;font-size:13px;color:var(--ink);text-align:left}
.leg button:hover{border-color:var(--line);background:#F7F9FB}
.leg button.sel{border-color:var(--un);background:#F5FBFE}
.leg b{margin-left:auto;padding-left:16px;font-weight:500}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0}
.mini{grid-template-columns:repeat(3,minmax(0,1fr))}.mini .tile{display:block}
.tile{background:#F7F9FB;border:1px solid var(--line);border-radius:8px;padding:14px;text-align:left;color:var(--ink);transition:.15s}
.tile:hover{border-color:var(--un);background:#fff;transform:translateY(-1px)}
.tile .l{font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.5px}
.tile .v{font-size:26px;font-weight:500;color:var(--navy)}
.tile .s{font-size:11.5px;color:var(--ink3)}
.pals{grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-bottom:16px}
.pcard{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;gap:16px;align-items:flex-start;transition:.15s;color:var(--ink);border-top:4px solid var(--un)}
.pcard:hover{box-shadow:0 6px 18px rgba(19,48,77,.08);transform:translateY(-2px)}
.pcard .num{font-size:11px;color:var(--un2);font-weight:500;letter-spacing:.6px;text-transform:uppercase}
.pcard .t{font-size:14.5px;font-weight:500;color:var(--navy);margin:2px 0 6px;line-height:1.3}
.pcard .s{font-size:12px;color:var(--ink2)}
.ring{flex-shrink:0}
.ag{display:inline-block;font-size:10.5px;font-weight:500;padding:2px 7px;border-radius:3px;background:var(--sky);color:var(--un3);margin:6px 4px 0 0}
.ag.a{background:#F1F3F6;color:var(--ink2)}
.todo button{width:100%;display:flex;gap:10px;align-items:flex-start;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 0;color:var(--ink)}
.todo button:last-child{border-bottom:0}
.todo button:hover .tx{color:var(--un2)}
.todo .id{font-weight:500;color:var(--navy);min-width:44px}
.todo .tx{font-size:13px;flex:1}
.pill{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11px;font-weight:500;white-space:nowrap}
.p-con{background:var(--sky);color:var(--un3)}.p-pen{background:var(--warnbg);color:#8A5A00}.p-apl{background:#EEF1F4;color:#52606D}.p-ok{background:#E3F1E6;color:#1E5E2C}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px 14px;font-size:12.5px;color:var(--ink2)}
.tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.pblock{margin-bottom:18px}
.phead{display:flex;gap:14px;align-items:center;padding:16px 20px;background:var(--navy2);color:#fff;border-radius:10px 10px 0 0}
.phead .t{font-size:14.5px;font-weight:500;line-height:1.35}
.phead .s{font-size:12px;color:#A9BED2}
.pbody{background:var(--card);border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px}
.lin{border-bottom:1px solid var(--line)}
.lin:last-child{border-bottom:0}
.lin>button{width:100%;display:flex;gap:12px;align-items:center;background:none;border:0;padding:14px 20px;text-align:left;color:var(--ink)}
.lin>button:hover{background:#F7F9FB}
.lin .code{font-weight:700;color:var(--un2);font-size:13px;min-width:30px}
.lin .lt{flex:1;font-size:13px}
.lin .chev{transition:transform .2s;color:var(--ink3)}
.lin.open .chev{transform:rotate(90deg)}
.segbar{display:flex;gap:2px;width:90px;height:8px;border-radius:4px;overflow:hidden;background:#EEF1F4;flex-shrink:0}
.lacts{display:none;padding:0 20px 12px 62px}
.lin.open .lacts{display:block}
.arow{display:flex;gap:10px;align-items:center;width:100%;background:#F7F9FB;border:1px solid transparent;border-radius:6px;padding:9px 12px;margin-bottom:6px;text-align:left;color:var(--ink);font-size:12.8px}
.arow:hover{border-color:var(--un);background:#fff}
.arow .id{font-weight:500;color:var(--navy);min-width:40px}
.arow .tx{flex:1}
.agrid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));margin-bottom:16px}
.acard{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;color:var(--ink);transition:.15s}
.acard:hover{border-color:var(--un)}
.acard.on{border:2px solid var(--un);padding:15px;background:#F5FBFE}
.acard .n{font-size:17px;font-weight:700;color:var(--navy);letter-spacing:.3px}
.acard .r{display:flex;gap:14px;margin:8px 0 10px;font-size:12px;color:var(--ink2)}
.acard .r b{display:block;font-size:20px;font-weight:500;color:var(--ink)}
.acard .pb{display:flex;gap:3px}
.acard .pb span{flex:1;height:6px;border-radius:3px;background:#EEF1F4}
.acard .pl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink3);margin-top:3px}
.mx{width:100%;border-collapse:separate;border-spacing:3px;font-size:12px}
.mx th{font-weight:500;color:var(--ink2);font-size:11px;padding:4px}
.mx td{text-align:center;border-radius:4px;padding:0}
.mx td button{width:100%;border:0;background:none;padding:8px 2px;color:inherit;font-size:12px;font-weight:500;border-radius:4px}
.mx td button:hover{outline:2px solid var(--navy)}
.mx td.nm{text-align:left;font-weight:500;padding-right:8px;white-space:nowrap}
.mx tr.dim td{opacity:.3}
.terr{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
.map{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;max-width:400px;margin:0 auto}
.mt{aspect-ratio:1.7;border:0;border-radius:8px;padding:6px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;transition:.15s;font-size:11px;line-height:1.15}
.mt b{font-size:16px;font-weight:500}
.mt:hover{transform:scale(1.04);box-shadow:0 4px 12px rgba(0,0,0,.15)}
.mt.on{outline:3px solid var(--navy);outline-offset:1px}
.mapwrap{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.geomap{width:100%;display:block}
.geomap path{cursor:pointer;transition:filter .15s}.geomap path:hover{filter:brightness(.93)}.geomap path.on{stroke:#13304D;stroke-width:3;stroke-dasharray:none}
.gl{text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round;font-family:"Roboto Condensed",Arial,sans-serif}
.gl.n{font-size:16px;font-weight:700;fill:#1F2933}.gl.m{font-size:10.5px;font-weight:700;fill:#1F2933}.gl.z{font-size:9.5px;fill:#52606D;stroke-width:2px}
.gl.s{font-size:8px;font-weight:500;fill:#1F2933;stroke-width:2.5px}
.sea,.ven{position:absolute;font-size:11px;font-style:italic;color:#52606D}.sea{left:14px;top:10px}.ven{right:14px;bottom:10px}
.mleg{position:absolute;left:12px;top:30px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;width:150px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.mlt{font-size:11.5px;color:#52606D;margin-bottom:8px}.mlb{height:9px;border-radius:5px;background:linear-gradient(90deg,#DCEEFA,#3D97D6)}
.mln{display:flex;justify-content:space-between;font-size:11.5px;color:#52606D;margin-top:4px}

.mapnote{font-size:11px;color:var(--ink3);margin-top:10px}
.scale{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink3);margin-top:8px}
.scale span{width:22px;height:8px;border-radius:2px}
.list .arow{background:var(--card);border:1px solid var(--line);padding:12px 14px}
.list .meta{font-size:11.5px;color:var(--ink3)}
.empty{padding:28px;text-align:center;color:var(--ink3);font-size:13px}
.pend{font-size:12.5px;color:var(--ink2);background:#F7F9FB;border:1px dashed #C7D0DA;border-radius:8px;padding:14px}
.scrim{position:fixed;inset:0;background:rgba(19,48,77,.35);opacity:0;pointer-events:none;transition:.2s;z-index:20}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(520px,100vw);background:#fff;z-index:21;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(19,48,77,.15)}
body.dr .scrim{opacity:1;pointer-events:auto}
body.dr .drawer{transform:none}
.dh{background:var(--un);color:#fff;padding:18px 22px}
.dh .k{font-size:11.5px;opacity:.9}
.dh h3{margin:4px 0 0;font-size:16px;font-weight:500;line-height:1.35}
.dh .x{position:absolute;right:14px;top:12px;background:rgba(255,255,255,.2);border:0;color:#fff;width:30px;height:30px;border-radius:50%;font-size:16px}
.db{padding:18px 22px;overflow:auto;flex:1}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;font-size:13px;margin-bottom:18px}
.kv span:nth-child(odd){color:var(--ink3);font-size:12px}
.kv .lnk{background:none;border:0;padding:0;color:var(--un2);text-decoration:underline;margin-right:8px}
.avp{border-left:3px solid var(--un);padding:4px 0 4px 12px;margin-bottom:12px;font-size:13px;white-space:pre-line;border-radius:0}
.avp b{display:inline-block;background:var(--sky);color:var(--un3);font-size:10.5px;padding:1px 7px;border-radius:3px;margin-bottom:4px}
.dnav{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:12px 22px}
.dnav button{background:none;border:1px solid var(--line);border-radius:6px;padding:6px 12px;color:var(--ink2)}
.dnav button:disabled{opacity:.4;cursor:default}
@media(max-width:900px){
 body{flex-direction:column;height:auto;overflow:auto}
 aside{width:100%;height:auto;position:static}
 .wrap{height:auto;overflow:visible}
 .brand{display:flex;gap:12px;align-items:center;padding:14px 16px}.logos{margin:0;width:150px;flex-shrink:0;padding:8px;gap:6px}.lg img{max-height:30px}
 nav{flex-direction:row;overflow-x:auto;padding:6px 8px}nav button{white-space:nowrap;padding:8px 10px}

}

 *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}

  .status-panel .donutbox{gap:10px}
  .status-panel .donut{flex-basis:116px;width:116px;height:116px}
  .status-copy .big{font-size:31px}
  .status-copy .big small{font-size:12px}
  .status-caption{font-size:12px}
  .status-copy .leg button{gap:6px;padding:5px 4px;font-size:11.5px}
  .summary-metrics{grid-template-columns:1fr}
  .summary-metrics .tile{display:grid;min-height:auto;grid-template-columns:54px minmax(0,1fr);align-items:center;column-gap:8px;padding:10px 12px}
  .summary-metrics .tile .v{grid-row:span 2}
  .summary-metrics .tile .l{margin-top:0}
  .summary-metrics .tile .s{grid-column:2}
  .palancas-summary{margin-top:20px}
  .summary-section-heading{align-items:flex-start;flex-direction:column;gap:2px}
  #view .pals{grid-template-columns:1fr;gap:8px}
  #view .pcard{min-height:96px;padding:12px}
  .followup-panel{padding:15px 12px}
  .followup-row{grid-template-columns:42px minmax(0,1fr)!important;gap:4px 8px!important;padding:11px 4px!important}
  .followup-row .tx{font-size:12.5px}
  .followup-meta{flex-direction:column;gap:2px}
  .followup-flags{grid-column:2;flex-direction:row;flex-wrap:wrap;gap:4px 9px;padding-bottom:3px}
}
</style>

function shadeOf(c,mx){if(!c)return["#EEF1F4","#8A96A3"];const t=c/mx;return t>.75?["#0B4F7C","#fff"]:t>.5?["#0077B3","#fff"]:t>.25?["#4FBCE8","#0B3550"]:["#BFE6F7","#0B3550"];}
function geoMuni(f){
  const vals=Object.values(f.properties||{}).map(v=>String(v??""));
  const name=vals.map(v=>MUNICIPIOS.find(m=>norm(m)===norm(v))).find(Boolean);
  const dpto=vals.some(v=>norm(v)==="la guajira"||/^44\d{3}$/.test(v.trim())||v.trim()==="44");
  return {name,dpto};
}
function geoSvg(cnt,mx,go){
  let fs=(GEO.features||[]).map(f=>({f,...geoMuni(f)})).filter(x=>x.name);
  if(fs.some(x=>x.dpto)) fs=fs.filter(x=>x.dpto);
  if(!fs.length) return null;
  const rings=g=>g.type==="Polygon"?g.coordinates:g.type==="MultiPolygon"?g.coordinates.flat():[];
  const pts=[];fs.forEach(x=>rings(x.f.geometry).forEach(r=>r.forEach(p=>pts.push(p))));
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const k=Math.cos((y0+y1)/2*Math.PI/180),W=500,pad=18,H=(W-2*pad)*(y1-y0)/((x1-x0)*k)+2*pad;
  const P=p=>[pad+(p[0]-x0)/(x1-x0)*(W-2*pad),pad+(y1-p[1])/(y1-y0)*(H-2*pad)];
  const vals=fs.map(x=>cnt[x.name]).filter(v=>v>0),lo=vals.length?Math.min(...vals):0,hi=vals.length?Math.max(...vals):0;
  const mix=(a,b,t)=>"#"+[0,2,4].map(i=>Math.round(parseInt(a.substr(i,2),16)+(parseInt(b.substr(i,2),16)-parseInt(a.substr(i,2),16))*t).toString(16).padStart(2,"0")).join("");
  const fill=v=>v>0?mix("DCEEFA","3D97D6",hi>lo?(v-lo)/(hi-lo):1):"#F1F3F4";
  const order=[...fs].sort((a,b)=>(cnt[a.name]>0)-(cnt[b.name]>0));
  const paths=order.map(x=>{const v=cnt[x.name],d=rings(x.f.geometry).map(r=>"M"+r.map(p=>P(p).map(n=>n.toFixed(1)).join(",")).join("L")+"Z").join("");
    return `<path d="${d}" fill-rule="evenodd" fill="${fill(v)}" stroke="${v>0?"#fff":"#6B7280"}" stroke-width="${v>0?1.5:1}" ${v>0?"":'stroke-dasharray="4 3"'} class="${S.mun===x.name?"on":""}" data-f="mun" data-v="${esc(x.name)}" data-toggleval="1" ${go?`data-go="${go}"`:""}><title>${esc(x.name)}: ${v} acciones</title></path>`;}).join("");
  const info=fs.map(x=>{const r=rings(x.f.geometry).sort((a,b)=>b.length-a.length)[0];let A=0,cx=0,cy=0;
    for(let i=0;i<r.length-1;i++){const [xa,ya]=P(r[i]),[xb,yb]=P(r[i+1]),c=xa*yb-xb*ya;A+=c;cx+=(xa+xb)*c;cy+=(ya+yb)*c;}
    if(Math.abs(A)<1e-6){const q=r.map(P);cx=avg(q.map(p=>p[0]));cy=avg(q.map(p=>p[1]));}else{cx/=3*A;cy/=3*A;}
    const maxX=Math.max(...r.map(p=>P(p)[0]));return {name:x.name,v:cnt[x.name],cx,cy,area:Math.abs(A)/2,maxX};});
  const placed=[],hit=(r)=>placed.some(q=>r.x0<q.x1&&r.x1>q.x0&&r.y0<q.y1&&r.y1>q.y0);
  let labels="";
  [...info].sort((a,b)=>b.area-a.area).forEach(i0=>{let i=i0;
    const big=i.area>=1500&&i.v>0, fsN=big?16:0, fsM=big?10.5:8;
    const w=Math.max(i.name.length*fsM*.56,big?fsN*.7*String(i.v).length:0)+4, h=big?fsN+fsM+4:fsM+3;
    const tries=[];for(const dy of [0,-6,6,-12,12,-18,18,-24,24])for(const dx of [0,-14,14,-24,24,-34,34])tries.push([dx,dy]);
    for(const [dx,dy] of tries){
      const top=i.cy+dy-h/2, r={x0:i.cx+dx-w/2,x1:i.cx+dx+w/2,y0:top,y1:top+h};
      if(hit(r))continue; placed.push(r); i={...i,cx:i.cx+dx};
      labels+=big?`<text x="${i.cx.toFixed(1)}" y="${(top+fsN-2).toFixed(1)}" class="gl n">${i.v}</text><text x="${i.cx.toFixed(1)}" y="${(top+fsN+fsM).toFixed(1)}" class="gl m">${esc(i.name)}</text>`
        :`<text x="${i.cx.toFixed(1)}" y="${(top+fsM).toFixed(1)}" class="gl s">${esc(i.name)}</text>`;
      break;
    }
  });
  const leg=vals.length?`<div class="mleg"><div class="mlt">Acciones por municipio</div><div class="mlb"></div><div class="mln"><span>${lo}</span><span>${hi}</span></div></div>`:"";
  return `<div class="mapwrap"><span class="sea">Mar Caribe</span><span class="ven">Venezuela</span><svg class="geomap" viewBox="0 0 ${W} ${H.toFixed(0)}">${paths}${labels}</svg>${leg}</div>`;
}
function mapa(D,go){
  const cnt=Object.fromEntries(MUNICIPIOS.map(m=>[m,D.filter(d=>d.munis.includes(m)).length])),mx=Math.max(1,...Object.values(cnt));
  const g=GEO&&geoSvg(cnt,mx,go);
  const body=g||`<div class="map">${MAPA.map(([m,c,r])=>{const [bg,fg]=shadeOf(cnt[m],mx);return `<button class="mt ${S.mun===m?"on":""}" style="grid-column:${c+1};grid-row:${r+1};background:${bg};color:${fg}" data-f="mun" data-v="${esc(m)}" data-toggleval="1" ${go?`data-go="${go}"`:""} title="${esc(m)}: ${cnt[m]} acciones"><span>${esc(m)}</span><b>${cnt[m]}</b></button>`;}).join("")}</div>`;
  return body+(g?"":`<div class="scale">Menos <span style="background:#BFE6F7"></span><span style="background:#4FBCE8"></span><span style="background:#0077B3"></span><span style="background:#0B4F7C"></span> Más · toque un municipio para ver sus acciones</div>`)+
    (g?"":`<div class="mapnote">Esquema provisional de norte a sur, no a escala. Se reemplaza por el mapa con límites municipales al cargar el archivo de límites.</div>`);

      <div style="height:12px"></div>
      <div class="pb">${pals.map(p=>{const x=[...L,...A].filter(d=>d.palNum===p).length;return `<span style="background:${x?(L.some(d=>d.palNum===p)?"#0077B3":"#7FD3F5"):"#EEF1F4"}" title="Palanca ${p}: ${x} acciones"></span>`;}).join("")}</div>
      <div class="pl">${pals.map(p=>`<span>P${p}</span>`).join("")}</div></button>`;}).join("");
  const lines=sortEs([...new Set(D.map(d=>d.linCod))]).sort((a,b)=>a.localeCompare(b,"es",{numeric:true}));
  const allAg=sortEs([...new Set(DATA.flatMap(d=>d.agencias))]);
  const mx=`<table class="mx"><tr><th></th>${lines.map(l=>`<th>${esc(l)}</th>`).join("")}</tr>${allAg.map(a=>`<tr class="${S.ag&&S.ag!==a?"dim":""}"><td class="nm">${esc(a)}</td>${lines.map(l=>{const it=D.filter(d=>d.linCod===l);
      const L=it.filter(d=>d.lider.includes(a)).length,A=it.filter(d=>!d.lider.includes(a)&&d.aliadas.includes(a)).length;
      if(!L&&!A)return `<td style="background:#F5F7FA"></td>`;
      return `<td style="background:${L?"#0077B3":"#CCEBF8"};color:${L?"#fff":"#0B3550"}"><button data-f2="${esc(a)}|${esc(l)}" title="${esc(a)} en ${esc(l)}: lidera ${L}, acompaña ${A}">${[L?`L${L}`:"",A?`A${A}`:""].filter(Boolean).join(" ")}</button></td>`;}).join("")}</tr>`).join("")}</table>`;
  const sel=S.ag?F().sort(byId):[];
  return `<div class="g agrid">${cards}</div>
    <div class="card" style="margin-bottom:16px"><h2>Matriz agencia × línea de trabajo</h2><p style="font-size:12px;color:var(--ink3);margin:-6px 0 10px">L = lidera · A = acompaña. Toque una celda para ver esas acciones.</p><div style="overflow-x:auto">${mx}</div></div>
    ${S.ag?`<div class="card"><h2>Acciones de ${esc(S.ag)}</h2><div class="list">${sel.map(arow).join("")||`<div class="empty">Sin acciones.</div>`}</div></div>`:""}`;
}

function vTerritorio(){
  const D=F("mun"),cnt=Object.fromEntries(MUNICIPIOS.map(m=>[m,D.filter(d=>d.munis.includes(m)).length]));
  const sinCob=D.filter(d=>!d.munis.length&&d.rep!=="aplazada");
  const sel=S.mun?F().sort(byId):[];
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,5);
  return `<div class="g terr"><div class="card"><h2>Acciones por municipio</h2>${mapa(D)}</div>
    <div class="card">${S.mun?`<h2>${esc(S.mun)} · ${sel.length} acciones</h2><div class="list">${sel.map(arow).join("")||`<div class="empty">Sin acciones en este municipio.</div>`}</div>`
      :`<h2>Municipios con más acciones</h2><div class="list">${top.map(([m,c])=>`<button class="arow" data-f="mun" data-v="${esc(m)}"><span class="tx"><b style="font-weight:500">${esc(m)}</b></span><span class="meta">${c} acciones</span></button>`).join("")}</div>
      <p style="font-size:12px;color:var(--ink3);margin:10px 0 0">Toque un municipio en el esquema para ver sus acciones.</p>`}
      ${sinCob.length?`<h2 style="margin-top:20px">Sin cobertura definida</h2><div class="list">${sinCob.sort(byId).map(arow).join("")}</div>`:""}</div></div>`;
}


function chips(){
  const lab={pal:v=>`Palanca ${v}`,lin:v=>`Línea ${v}`,ag:v=>v,mun:v=>v,rep:v=>REP[v].t,q:v=>`“${v}”`};
  const act=Object.keys(lab).filter(k=>S[k]);
  $("chips").innerHTML=act.map(k=>`<button class="chip" data-clear="${k}">${esc(lab[k](S[k]))}<i>×</i></button>`).join("")+(act.length>1?`<button class="chip clear" data-clear="all">Limpiar todo</button>`:"");
}

function render(){
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.view===S.view));
  $("vtitle").textContent=VIEWS[S.view][0];$("vsub").textContent=VIEWS[S.view][1];
  chips();
  const fn={resumen:vResumen,palancas:vPalancas,agencias:vAgencias,territorio:vTerritorio}[S.view];
  $("view").innerHTML=`<div class="view">${fn()}</div>`;
}

function openDrawer(id){
  const d=DATA.find(x=>x.id===id);if(!d)return;CUR=id;
  LIST=[...document.querySelectorAll("#view [data-open]")].map(b=>b.dataset.open).filter((v,i,a)=>a.indexOf(v)===i);
  const i=LIST.indexOf(id);
  const parts=d.avances&&!/^revisar\.?$/i.test(d.avances)?d.avances.split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean):[];
  const av=parts.length?parts.map(p=>{const m=p.match(/^([A-ZÁÉÍÓÚÑ\/]{2,}(?:\s?[A-ZÁÉÍÓÚÑ\/]+)?)\s*:\s*/);return `<div class="avp">${m?`<b>${esc(m[1])}</b><br>`:""}${esc(m?p.slice(m[0].length):p)}</div>`;}).join("")
    :`<div class="avp" style="border-left-color:var(--warn);color:var(--ink2)">Sin avances reportados.</div>`;
  const lnk=(f,v)=>`<button class="lnk" data-f="${f}" data-v="${esc(v)}" data-close="1">${esc(v)}</button>`;
  $("drawer").innerHTML=`<div class="dh"><div class="k">Palanca ${d.palNum} · Línea ${esc(d.linCod)} · Acción ${esc(d.id)}</div><h3>${esc(d.accion)}</h3><button class="x" data-close="1" aria-label="Cerrar">×</button></div>
   <div class="db"><div style="margin-bottom:14px">${pill(d)}</div>
   <div class="kv"><span>Línea de trabajo</span><span>${esc(d.linTexto)}</span>
   <span>AFP líder</span><span>${d.lider.length?d.lider.map(a=>lnk("ag",a)).join(""):"Por definir"}</span>
   <span>Agencias aliadas</span><span>${d.aliadas.length?d.aliadas.map(a=>lnk("ag",a)).join(""):"—"}</span>
   <span>Cobertura</span><span>${d.munis.length?d.munis.map(m=>lnk("mun",m)).join(""):esc(d.cobertura||"Por definir")}</span>
   ${d.estado?`<span>Estado</span><span>${esc(d.estado)}${d.pct!==null?` · ${d.pct} %`:""}</span>`:""}
   ${d.tipo?`<span>Tipo de acción</span><span>${esc(d.tipo)}</span>`:""}
   ${d.cierre?`<span>Fecha de cierre</span><span>${esc(d.cierre)}</span>`:""}
   ${d.evidencia?`<span>Evidencia</span><span>${esc(d.evidencia)}</span>`:""}
   ${d.reporte?`<span>Último reporte</span><span>${esc(d.reporte)}</span>`:""}</div>
   <h2 style="font-size:12px;font-weight:500;color:var(--ink2);text-transform:uppercase;letter-spacing:.6px;margin:0 0 10px">Avances reportados</h2>${av}</div>
   <div class="dnav"><button data-nav="-1" ${i<=0?"disabled":""}>‹ Anterior</button><span style="font-size:12px;color:var(--ink3);align-self:center">${i+1} de ${LIST.length}</span><button data-nav="1" ${i<0||i>=LIST.length-1?"disabled":""}>Siguiente ›</button></div>`;
  document.body.classList.add("dr");
}
const closeDrawer=()=>{document.body.classList.remove("dr");CUR=null;};

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-view],[data-f],[data-f2],[data-go],[data-open],[data-close],[data-clear],[data-toggle],[data-nav]");if(!t)return;
  if(t.dataset.nav){const i=LIST.indexOf(CUR)+ +t.dataset.nav;if(LIST[i])openDrawer(LIST[i]);return;}
  if(t.dataset.open){openDrawer(t.dataset.open);return;}
  if(t.dataset.close)closeDrawer();
  if(t.dataset.toggle){const l=t.dataset.toggle;OPEN.has(l)?OPEN.delete(l):OPEN.add(l);t.parentElement.classList.toggle("open");return;}
  if(t.dataset.clear){if(t.dataset.clear==="all"){Object.assign(S,{pal:"",lin:"",ag:"",mun:"",rep:"",q:""});$("q").value="";}else{S[t.dataset.clear]="";if(t.dataset.clear==="q")$("q").value="";}render();return;}
  if(t.dataset.view){S.view=t.dataset.view;render();toTop();return;}
  if(t.dataset.f2){const [a,l]=t.dataset.f2.split("|");S.ag=a;S.lin=l;render();return;}
  if(t.dataset.f!==undefined){const k=t.dataset.f,v=t.dataset.v;S[k]=(t.dataset.toggleval&&S[k]===v)?"":v;}
  if(t.dataset.go){S.view=t.dataset.go;toTop();}
  render();
});
document.addEventListener("keydown",e=>{if(!CUR)return;if(e.key==="Escape")closeDrawer();if(e.key==="ArrowRight"||e.key==="ArrowLeft"){const i=LIST.indexOf(CUR)+(e.key==="ArrowRight"?1:-1);if(LIST[i])openDrawer(LIST[i]);}});
let qt;$("q").addEventListener("input",e=>{clearTimeout(qt);qt=setTimeout(()=>{S.q=e.target.value.trim();render();},200);});

function init(rows){
  DATA=rows.map(prep).filter(d=>d.accion);
  $("corte").textContent=corte.toLocaleDateString("es-CO",{day:"numeric",month:"long",year:"numeric"});
  render();
}
if(CONFIG.GEOJSON_URL&&!GEO)fetch(CONFIG.GEOJSON_URL).then(r=>r.json()).then(j=>{GEO=j;if(DATA.length)render();}).catch(()=>{});
if(CONFIG.CSV_URL){fetch(CONFIG.CSV_URL).then(r=>{if(!r.ok)throw 0;return r.text();}).then(t=>init(parseCSV(t))).catch(()=>init(SAMPLE));}
else init(SAMPLE);
</script>
</body>
</html>
